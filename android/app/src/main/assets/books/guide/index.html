<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>hello</title>
  <link rel="stylesheet" href="styles.css">
  <style>.art-page[aria-label="封面"]{--ct-title-color:#EFC58E;--ct-title-x:50%;--ct-title-y:12%;--ct-title-align:center;--ct-title-r:auto;--ct-title-shift:translateX(-50%);--ct-title-size:6.6cqw;--ct-title-family:var(--book-serif);--ct-subtitle-color:#F7F6F0;--ct-subtitle-x:50%;--ct-subtitle-y:21.5%;--ct-subtitle-align:center;--ct-subtitle-r:auto;--ct-subtitle-shift:translateX(-50%);--ct-subtitle-size:2.5cqw;--ct-subtitle-family:var(--book-serif)}</style>
</head>
<body>
<main class="room">
  <header class="book-header">
    <span>画册使用说明</span><h1>hello</h1><span id="orientation">Open spread</span>
  </header>
  <section class="stage" aria-label="可翻页的摄影集">
    <div class="book-rig">
      <div id="book" class="book" data-page-width="512" data-page-height="640">
        <article class="book-page art-page photo recto" data-density="hard" style="--ct-title-color:#EFC58E;--ct-title-x:50%;--ct-title-y:12%;--ct-title-align:center;--ct-title-r:auto;--ct-title-shift:translateX(-50%);--ct-title-size:6.6cqw;--ct-title-family:var(--book-serif);--ct-subtitle-color:#F7F6F0;--ct-subtitle-x:50%;--ct-subtitle-y:21.5%;--ct-subtitle-align:center;--ct-subtitle-r:auto;--ct-subtitle-shift:translateX(-50%);--ct-subtitle-size:2.5cqw;--ct-subtitle-family:var(--book-serif)" aria-label="封面">
          <figure class="plate"><img src="assets/photos/01-01.jpg" alt="第 0 张照片（竖构图）" width="853" height="1280" loading="eager" decoding="async" fetchpriority="high"></figure>
          <div class="cover-scrim"></div>
          <span class="outer-y top" aria-hidden="true"></span>
          <span class="outer-y bottom" aria-hidden="true"></span>
          <span class="outer-x right" aria-hidden="true"></span>
          <h2 class="cover-title">hello</h2>
          <p class="cover-subtitle">画册使用说明</p>
          <p class="cover-foot">6 PHOTOGRAPHS</p>
        </article>
        <article class="book-page art-page photo verso" aria-label="图 1">
          <figure class="plate large"><img src="assets/photos/02-02.jpg" alt="第 1 张照片（竖构图）" width="853" height="1280" loading="eager" decoding="async"></figure>
          <span class="outer-y top" aria-hidden="true"></span>
          <span class="outer-y bottom" aria-hidden="true"></span>
          <span class="outer-x right" aria-hidden="true"></span>
          <p class="folio"> 2</p>
        </article>
        <article class="book-page art-page photo recto" aria-label="图 2">
          <figure class="plate large"><img src="assets/photos/03-03.jpg" alt="第 2 张照片（竖构图）" width="853" height="1280" loading="eager" decoding="async"></figure>
          <span class="outer-y top" aria-hidden="true"></span>
          <span class="outer-y bottom" aria-hidden="true"></span>
          <span class="outer-x left" aria-hidden="true"></span>
          <p class="folio"> 3</p>
        </article>
        <!-- ★ R40（2026-10-16，佘先生三次指示 + 一次纠偏）：
               「先改原来的第四页」「在第四页和第五页的中间加一页」
               「样式参照已有的格式」「不要在中间有空白页」「不要版权页那一张多余的」
             ⇒ 第 4 页 = 书架说明卡、第 5 页 = 翻页说明卡，两页都是**图片页**
               （与图 1/图 2 同款 plate 结构）；文字是渲染进图里的，与现有 6 张卡
               同一套版式（853×1280、米白纸底、上下暖金细线带菱形、居中楷体两行、
               底部页码），由 `tools/_render_guide_card.py` 照 02-02.jpg 像素反推
               的参数渲出。
             ⚠ 不要再往这两页塞 HTML 文字（`.colophon`）：① 壳层 layout.js 第 20)
               条把 colophon 整块 display:none（真机上是空白页）；② 老内核不认
               cqw 字号。文字烤进图里，这两个坑都不存在。
             ⚠ 页码：卡片内页码 = 书内 folio − 1（与现有 6 张卡同一口径，
               02-02 卡是"1"而书里 folio 是 2）；页脚那层 `.folio` 照旧保留
               （第八轮他明说"页码留"）。 -->
        <article class="book-page art-page photo verso" aria-label="书架说明">
          <figure class="plate large"><img src="assets/photos/04-04.jpg" alt="书架是您放置画册的地方，其中的教学画册可以隐藏" width="853" height="1280" loading="eager" decoding="async"></figure>
          <span class="outer-y top" aria-hidden="true"></span>
          <span class="outer-y bottom" aria-hidden="true"></span>
          <span class="outer-x right" aria-hidden="true"></span>
          <p class="folio"> 4</p>
        </article>
        <article class="book-page art-page photo recto" aria-label="翻页说明">
          <figure class="plate large"><img src="assets/photos/07-07.jpg" alt="画册可以手动翻页，也可以自动翻页，速度可以调节" width="853" height="1280" loading="eager" decoding="async"></figure>
          <span class="outer-y top" aria-hidden="true"></span>
          <span class="outer-y bottom" aria-hidden="true"></span>
          <span class="outer-x left" aria-hidden="true"></span>
          <p class="folio"> 5</p>
        </article>
        <article class="book-page art-page photo verso" aria-label="图 4">
          <figure class="plate large"><img src="assets/photos/05-05.jpg" alt="第 4 张照片（竖构图）" width="853" height="1280" loading="eager" decoding="async"></figure>
          <span class="outer-y top" aria-hidden="true"></span>
          <span class="outer-y bottom" aria-hidden="true"></span>
          <span class="outer-x right" aria-hidden="true"></span>
          <p class="folio"> 6</p>
        </article>
        <article class="book-page art-page photo recto" aria-label="图 5">
          <figure class="plate large"><img src="assets/photos/06-06.jpg" alt="第 5 张照片（竖构图）" width="853" height="1280" loading="eager" decoding="async"></figure>
          <span class="outer-y top" aria-hidden="true"></span>
          <span class="outer-y bottom" aria-hidden="true"></span>
          <span class="outer-x left" aria-hidden="true"></span>
          <p class="folio"> 7</p>
        </article>
        <article class="book-page art-page cloth recto" data-density="hard" aria-label="封底">
          <span class="back-mark">hello</span>
        </article>
      </div>
    </div>
  </section>
  <footer class="controls" aria-label="翻页控制">
    <button id="previous" type="button" aria-label="上一页">←</button>
    <!-- ★ Phase 28：中间那列从**五行**压成**两行**（佘先生：「查看画册时的那个页数和
         自动翻页UI组块太大了，上下宽度压缩一半，要让图片占据画面的绝大部分，比如那个
         自动翻页和其速度组块完全可以放在同一行，跳转页面的组块做成一行」）。
         第 1 行 `.nav-row`  = 状态（老入口：点页码变输入框）+ 常驻「跳到第 N 页」；
         第 2 行 `.auto-row` = 自动翻页开关 + 它的速度下拉；
         Phase 28 时说明小字挪进第 2 行末尾，窄窗口由 CSS 藏掉。
         改前脚部实测 121.2px → 改后实测 **46.6px**（6 档窗口量下来都是这个数）。
         ★ Phase 31：佘先生说脚部那行说明小字不美观 ⇒ **整行删掉**（不是藏起来）。
         ⚠ 注释里也别把那行字的原文写出来：核心层「成功Y」有一条判据扫整个
         HTML 模板、不许那句话再出现，注释命中同样算（findings 71 同族的坑）。
         ⚠ .jump-row 仍必须排在 #page-auto **之前**：DOM 顺序与几何位置都有断言守着。 -->
    <div class="status">
      <div class="status-row nav-row">
        <button id="page-jump" type="button" class="page-jump" aria-label="跳转到指定页"
                title="点击输入页码，回车跳转"><span id="page-status" aria-live="polite">Cover</span></button>
        <input id="page-input" class="page-input" type="text" inputmode="numeric" autocomplete="off"
               spellcheck="false" aria-label="输入页码后按回车跳转" hidden>
        <!-- 跳到指定页（Phase 26）：佘先生「在查看画册的界面的选择查看的页数的功能
             恢复，就设计在自动翻页的组块的上方，注意布局协调」。
             原来跳页只有一个"点页码 → 就地变输入框"的隐藏入口（#page-jump），
             功能是在的，但看不出来。这里补一个常驻入口 —— Phase 28 起它与状态
             并排在同一行，不再自己占一行。 -->
        <div class="jump-row">
          <label class="jump-row-k" for="page-select">跳到第</label>
          <input id="page-select" class="page-select" type="text" inputmode="numeric"
                 autocomplete="off" spellcheck="false" aria-label="输入页码，回车跳转">
          <span class="jump-row-u">页</span>
          <button id="page-go" class="page-go" type="button">跳转</button>
        </div>
      </div>
      <div class="status-row auto-row">
        <!-- 自动翻页开关（Phase 20）：默认关（aria-pressed="false"、文案=未播放态），
             点了才开始自动翻。按钮文本 / data-stop-* 是"未播放 / 播放中"两套文案，
             由 flipbook.js 换用，所以这里不要把它们写进别的脚本里。
             title 里的 {n} 由 flipbook.js 换成当前秒数 —— 调过速度后提示语不能还停在 5。 -->
        <button id="page-auto" type="button" class="page-auto" aria-pressed="false"
                data-stop-label="停止自动翻页" data-stop-title="点击停止自动翻页"
                title="自动翻页：每 {n} 秒翻一页">自动翻页</button>
        <!-- 自动翻页调速（Phase 23 起 2~10 秒/页；Phase 26 补了最快的 **1 秒**档，
             现在共 10 档；默认仍是 5 秒 ⇒ 没动过速度的成品与上一版一字不差）。
             少了它（老成品 HTML）就退回 5 秒，行为与 Phase 20 一致。 -->
        <select id="page-auto-speed" class="page-auto-speed" aria-label="自动翻页速度"
                title="每页停几秒（1~10 秒）">
          <option value="1">1 秒</option>
          <option value="2">2 秒</option>
          <option value="3">3 秒</option>
          <option value="4">4 秒</option>
          <option value="5" selected>5 秒</option>
          <option value="6">6 秒</option>
          <option value="7">7 秒</option>
          <option value="8">8 秒</option>
          <option value="9">9 秒</option>
          <option value="10">10 秒</option>
        </select>
      </div>
    </div>
    <!-- Phase 28：翻到最后一跨页之后再点它 = 合上封底；合上之后再点它 = **整本翻回封面**，
         所以它不再在末页变灰（原来末页它是 disabled，点了没反应）。 -->
    <button id="next" type="button" aria-label="下一页">→</button>
  </footer>
</main>
<script src="vendor/page-flip.browser.js"></script>
<script src="flipbook.js"></script>
</body>
</html>
